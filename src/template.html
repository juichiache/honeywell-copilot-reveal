<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Honeywell Copilot Case Study</title>
    <link rel="stylesheet" href="node_modules/reveal.js/dist/reset.css" />
    <link rel="stylesheet" href="node_modules/reveal.js/dist/reveal.css" />
    <link rel="stylesheet" href="node_modules/reveal.js/dist/theme/league.css" />
    <style>
      :root {
        --r-main-font: "Inter", "Segoe UI", Arial, sans-serif;
        --r-heading-font: "Inter", "Segoe UI", Arial, sans-serif;
        --accent: #6ba3ff;
        --accent-soft: rgba(107, 163, 255, 0.18);
        --success: #4ade80;
        --ink: rgba(255,255,255,0.92);
        --muted: rgba(255,255,255,0.58);
        --line: rgba(255,255,255,0.18);
        --card-bg: rgba(255,255,255,0.06);
      }
      .reveal .slides { text-align: center; }
      .reveal section.slide {
        box-sizing: border-box;
        padding: 0.5rem 1.5rem 0.5rem;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        height: 100%;
        max-height: 100%;
        overflow: hidden;
      }
      .reveal h1, .reveal h2, .reveal h3 {
        letter-spacing: -0.02em;
        text-transform: none;
      }
      .reveal h2 {
        margin: 0.08em 0 0.15em;
        font-size: 1.38em;
        line-height: 1.12;
      }
      .reveal .subtitle {
        font-size: 0.78em;
        color: var(--muted);
        margin: 0 0 0.3em;
      }
      .reveal .tagline {
        font-size: 0.88em;
        color: var(--ink);
        font-weight: 400;
        margin: 0.25em 0 0.35em;
        max-width: 90%;
        opacity: 0.9;
      }
      .kicker {
        font-size: 0.4em;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        opacity: 0.6;
        margin-bottom: 0.2em;
      }

      /* Hero visuals */
      .hero-svg {
        display: block;
        max-width: min(90%, 960px);
        max-height: 230px;
        width: auto;
        height: auto;
        object-fit: contain;
        margin: 0.3rem auto;
        flex: 0 1 auto;
        min-height: 0;
        align-self: center;
        background: rgba(255,255,255,0.93);
        border-radius: 10px;
        padding: 6px;
      }
      .hero-icon {
        width: 110px;
        height: 110px;
        color: var(--accent);
        margin: 0.4rem auto 0.35rem;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }
      .hero-icon svg { width: 100%; height: 100%; }

      /* Chips */
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 0.4rem;
        justify-content: center;
        margin: 0.35rem 0;
        max-width: 94%;
      }
      .chip {
        font-size: 0.6em;
        padding: 0.38rem 0.78rem;
        background: var(--card-bg);
        border: 1px solid var(--line);
        border-radius: 999px;
        color: var(--ink);
        line-height: 1.15;
      }

      /* Pull quotes */
      .quotes {
        display: flex;
        flex-direction: column;
        gap: 0.25rem;
        margin: 0.25rem 0;
        max-width: 90%;
        flex-shrink: 0;
      }
      .pull-quote {
        font-size: 0.62em;
        font-style: italic;
        color: var(--ink);
        border-left: 4px solid var(--accent);
        background: var(--accent-soft);
        padding: 0.38rem 0.7rem;
        border-radius: 0 6px 6px 0;
        margin: 0;
        text-align: left;
      }

      /* Split / cards */
      .split {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0.8rem;
        width: 92%;
        margin: 0.3rem auto;
        flex-shrink: 0;
      }
      .card {
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 0.5rem 0.7rem;
        background: var(--card-bg);
        text-align: left;
      }
      .card h4 {
        margin: 0 0 0.3rem;
        font-size: 0.75em;
        color: var(--ink);
        opacity: 0.9;
      }
      .card.before { border-color: #fbbf24; }
      .card.before h4 { color: #fcd34d; }
      .card.after { border-color: var(--success); }
      .card.after h4 { color: var(--success); }
      .card .chips { justify-content: flex-start; margin: 0; gap: 0.3rem; }
      .card .chip { font-size: 0.52em; padding: 0.28rem 0.6rem; }

      /* Bottom line — always visible, never clipped */
      .bottom-line {
        margin-top: 0.3rem;
        flex-shrink: 0;
        padding: 0.38rem 0.8rem;
        border-left: 4px solid var(--accent);
        background: var(--accent-soft);
        font-size: 0.52em;
        width: 92%;
        text-align: left;
        border-radius: 0 6px 6px 0;
        align-self: center;
        color: var(--ink);
      }

      /* Title slide */
      .title-slide { justify-content: center; }
      .title-slide h2 { font-size: 2.1em; }
      .title-slide .subtitle { font-size: 0.95em; }
    </style>
  </head>
  <body>
    <div class="reveal">
      <div class="slides">
        %%SLIDES%%
      </div>
    </div>
    <script src="node_modules/reveal.js/dist/reveal.js"></script>
    <script>
      Reveal.initialize({
        width: 1280,
        height: 720,
        margin: 0.08,
        minScale: 0.2,
        maxScale: 1.05,
        hash: true,
        controls: true,
        progress: true,
        transition: "fade",
        slideNumber: "c/t"
      });
    </script>
  </body>
</html>
