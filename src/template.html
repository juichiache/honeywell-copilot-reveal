<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Honeywell Copilot Case Study</title>
    <link rel="stylesheet" href="node_modules/reveal.js/dist/reset.css" />
    <link rel="stylesheet" href="node_modules/reveal.js/dist/reveal.css" />
    <link rel="stylesheet" href="node_modules/reveal.js/dist/theme/white.css" />
    <style>
      :root {
        --r-main-font: "Inter", "Segoe UI", Arial, sans-serif;
        --r-heading-font: "Inter", "Segoe UI", Arial, sans-serif;
      }
      .reveal .slides {
        text-align: left;
      }
      .reveal section {
        box-sizing: border-box;
        padding: 1.1rem 1.35rem;
      }
      .reveal h1,
      .reveal h2,
      .reveal h3 {
        letter-spacing: -0.02em;
        text-transform: none;
      }
      .reveal h2 {
        margin-bottom: 0.35em;
      }
      .reveal p,
      .reveal ul,
      .reveal blockquote {
        margin-top: 0.45em;
        margin-bottom: 0.45em;
      }
      .reveal li {
        margin: 0.12em 0;
      }
      .reveal section.has-visual {
        font-size: 0.76em;
      }
      .reveal section.has-visual h2 {
        font-size: 1.36em;
      }
      .reveal section.has-visual ul {
        font-size: 0.7em;
        line-height: 1.18;
      }
      .kicker {
        font-size: 0.48em;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        opacity: 0.75;
      }
      .bottom-line {
        margin-top: 1rem;
        padding: 0.8rem 1rem;
        border-left: 4px solid #2063ff;
        background: rgba(32, 99, 255, 0.08);
        font-size: 0.72em;
      }
      .split {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 1.5rem;
      }
      .card {
        border: 1px solid #d8dce5;
        border-radius: 8px;
        padding: 0.8rem 1rem;
        background: #fff;
      }
      .small {
        font-size: 0.72em;
      }
      .diagram {
        display: block;
        width: min(92%, 720px);
        max-height: 32vh;
        object-fit: contain;
        margin: 0.5rem auto 0;
        border: 1px solid #d8dce5;
        border-radius: 8px;
      }
      .has-visual .bottom-line {
        font-size: 0.62em;
        margin-top: 0.55rem;
        padding: 0.55rem 0.75rem;
      }
    </style>
  </head>
  <body>
    <div class="reveal">
      <div class="slides">
        %%SLIDES%%
      </div>
    </div>
    <script src="node_modules/reveal.js/dist/reveal.js"></script>
    <script>
      Reveal.initialize({
        width: 1280,
        height: 720,
        margin: 0.14,
        minScale: 0.2,
        maxScale: 1.05,
        hash: true,
        controls: true,
        progress: true,
        transition: "fade",
        slideNumber: "c/t"
      });
    </script>
  </body>
</html>
