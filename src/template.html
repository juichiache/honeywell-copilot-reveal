<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Honeywell Copilot Case Study</title>
    <link rel="stylesheet" href="node_modules/reveal.js/dist/reset.css" />
    <link rel="stylesheet" href="node_modules/reveal.js/dist/reveal.css" />
    <link rel="stylesheet" href="node_modules/reveal.js/dist/theme/league.css" />
    <style>
      :root {
        --r-main-font: "Inter", "Segoe UI", Arial, sans-serif;
        --r-heading-font: "Inter", "Segoe UI", Arial, sans-serif;
        --accent: #6ba3ff;
        --accent-soft: rgba(107, 163, 255, 0.18);
        --success: #4ade80;
        --ink: rgba(255,255,255,0.92);
        --muted: rgba(255,255,255,0.58);
        --line: rgba(255,255,255,0.18);
        --card-bg: rgba(255,255,255,0.07);
      }

      /* Scale the entire section down so all em-based sizes fit in 720px */
      .reveal .slides { text-align: center; }
      .reveal section.slide {
        box-sizing: border-box;
        font-size: 0.7em;       /* ~28px base; everything em-based scales with this */
        padding: 0.5em 1.4em;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
      }

      .reveal h1, .reveal h2, .reveal h3 {
        letter-spacing: -0.02em;
        text-transform: none;
      }
      .reveal h2 {
        margin: 0.08em 0 0.18em;
        font-size: 1.55em;
        line-height: 1.12;
      }
      .reveal .subtitle {
        font-size: 0.82em;
        color: var(--muted);
        margin: 0 0 0.3em;
      }
      .reveal .tagline {
        font-size: 0.9em;
        color: var(--ink);
        margin: 0.2em 0 0.3em;
        max-width: 92%;
        opacity: 0.9;
      }
      .kicker {
        font-size: 0.42em;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        opacity: 0.6;
        margin-bottom: 0.25em;
        flex-shrink: 0;
      }

      /* Hero SVGs — fixed px cap so they never eat too much vertical space */
      .hero-svg {
        display: block;
        max-width: 92%;
        max-height: 150px;
        width: auto;
        height: auto;
        object-fit: contain;
        margin: 0.3em auto;
        align-self: center;
        flex-shrink: 0;
        background: rgba(255,255,255,0.92);
        border-radius: 10px;
        padding: 5px;
        box-sizing: border-box;
      }

      /* Icons */
      .hero-icon {
        width: 2.8em;
        height: 2.8em;
        color: var(--accent);
        margin: 0.3em auto 0.25em;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }
      .hero-icon svg { width: 100%; height: 100%; }

      /* Chips */
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 0.3em;
        justify-content: center;
        margin: 0.25em 0;
        max-width: 94%;
        flex-shrink: 0;
      }
      .chip {
        font-size: 0.62em;
        padding: 0.3em 0.7em;
        background: var(--card-bg);
        border: 1px solid var(--line);
        border-radius: 999px;
        color: var(--ink);
        line-height: 1.2;
      }

      /* Pull quotes */
      .quotes {
        display: flex;
        flex-direction: column;
        gap: 0.25em;
        margin: 0.25em 0;
        max-width: 90%;
        flex-shrink: 0;
      }
      .pull-quote {
        font-size: 0.65em;
        font-style: italic;
        color: var(--ink);
        border-left: 3px solid var(--accent);
        background: var(--accent-soft);
        padding: 0.4em 0.75em;
        border-radius: 0 5px 5px 0;
        margin: 0;
        text-align: left;
      }

      /* Split / cards */
      .split {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0.7em;
        width: 94%;
        margin: 0.3em auto;
        flex-shrink: 0;
      }
      .card {
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 0.5em 0.65em;
        background: var(--card-bg);
        text-align: left;
      }
      .card h4 {
        margin: 0 0 0.3em;
        font-size: 0.76em;
        color: var(--ink);
        opacity: 0.9;
      }
      .card.before { border-color: #fbbf24; }
      .card.before h4 { color: #fcd34d; }
      .card.after  { border-color: var(--success); }
      .card.after h4  { color: var(--success); }
      .card .chips { justify-content: flex-start; margin: 0; gap: 0.22em; }
      .card .chip  { font-size: 0.54em; padding: 0.22em 0.5em; }

      /* Before/after split gets extra compact layout */
      .split.ba-split { gap: 0.7em; margin: 0.3em auto; }
      .split.ba-split .card { padding: 0.55em 0.75em; }
      .split.ba-split .card h4 { font-size: 0.78em; margin-bottom: 0.3em; }
      .split.ba-split .card .chip { font-size: 0.6em; padding: 0.3em 0.6em; }

      /* Bottom line */
      .bottom-line {
        flex-shrink: 0;
        margin-top: 0.35em;
        padding: 0.38em 0.75em;
        border-left: 3px solid var(--accent);
        background: var(--accent-soft);
        font-size: 0.55em;
        width: 94%;
        text-align: left;
        border-radius: 0 5px 5px 0;
        align-self: center;
        color: var(--ink);
      }

      /* Title slide */
      .title-slide { justify-content: center; }
      .title-slide h2   { font-size: 2em; }
      .title-slide .subtitle { font-size: 0.9em; }
    </style>
  </head>
  <body>
    <div class="reveal">
      <div class="slides">
        %%SLIDES%%
      </div>
    </div>
    <script src="node_modules/reveal.js/dist/reveal.js"></script>
    <script>
      Reveal.initialize({
        width: 1280,
        height: 720,
        margin: 0.08,
        minScale: 0.2,
        maxScale: 1.05,
        hash: true,
        controls: true,
        progress: true,
        transition: "fade",
        slideNumber: "c/t"
      });
    </script>
  </body>
</html>
